<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLECTIVOS DE LA COMUNIDAD</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #19567C;
            --blanco: #FFFFFF;
            --acento: #4AB5E0;
            --magenta: #D34872;
            --azul-inst: #19567C;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--blanco);
            margin: 0;
            min-height: 100vh;
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: 8px;
            background-color: #f8fafc;
            z-index: 10;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #F3F6F9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E6EDF3;
            border-radius: 4px;
        }

        /* Ajustes para la ventana de Info de Google Maps */
        .gm-style-iw.gm-style-iw-c {
            border-radius: 8px !important;
            padding: 12px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }

        .gm-style-iw-d {
            overflow: hidden !important;
        }

        button.gm-ui-hover-effect {
            display: none !important;
        }

        /* Ocultamos el botón nativo de Google */

        /* Estilos del Botón de Cierre Personalizado */
        .custom-close-btn {
            position: absolute;
            right: -4px;
            top: -6px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #94A3B8;
            font-size: 22px;
            font-weight: bold;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
            z-index: 50;
        }

        .custom-close-btn:hover {
            background-color: #F1F5F9;
            color: var(--bg-main);
        }

        .incident-close:hover {
            color: var(--magenta);
        }
    </style>
</head>

<body class="flex flex-col">

    <header class="bg-[var(--bg-main)] shadow-lg border-b-4 border-[var(--acento)] z-20 py-6 px-4 shrink-0">
        <div class="max-w-[1600px] mx-auto flex items-center justify-center gap-4">
            <div
                class="bg-white text-[var(--bg-main)] rounded-full h-14 w-14 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-bus text-2xl"></i>
            </div>
            <div class="flex flex-col">
                <h1 class="text-3xl font-extrabold tracking-tight uppercase leading-none">COLECTIVOS DE LA COMUNIDAD
                </h1>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[1600px] mx-auto py-8 px-4 flex-1 flex flex-col lg:flex-row gap-6">

        <aside
            class="w-full lg:w-80 bg-white rounded-xl shadow-md border border-[#E6EDF3] flex flex-col max-h-[calc(100vh-200px)] overflow-hidden shrink-0 z-20">
            <div class="p-4 border-b bg-[#F3F6F9] flex items-center gap-2">
                <i data-lucide="filter" class="text-[#0B5F8D] h-5 w-5"></i>
                <h3 class="font-bold text-[#0F172A] uppercase text-sm">Filtros Operativos</h3>
            </div>

            <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-6">

                <!-- Sección Colapsable: Próximo Colectivo -->
                <div class="bg-[#19567C]/10 p-3 rounded-lg border border-[#19567C]/30">
                    <h4 class="text-xs font-extrabold text-[#19567C] uppercase mb-3 flex items-center justify-between cursor-pointer"
                        onclick="toggleSeccionColectivo()">
                        <span class="flex items-center gap-2">
                            <i data-lucide="bus-front" class="h-4 w-4 text-[#19567C]"></i> Próximo Colectivo
                        </span>
                        <i id="arrow-colectivo" data-lucide="chevron-down"
                            class="h-4 w-4 transition-transform duration-200"
                            style="transform: rotate(180deg);"></i>
                    </h4>
                    <div id="content-colectivo" class="space-y-3">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-700">Línea:</label>
                            <select id="select-colectivo-linea"
                                class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:border-[#19567C] font-semibold text-[#0F172A] cursor-pointer">
                                <option value="">Seleccione una línea</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-700">Ramal / Recorrido:</label>
                            <select id="select-colectivo-recorrido" disabled
                                class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:border-[#19567C] font-semibold text-[#0F172A] cursor-pointer disabled:opacity-50">
                                <option value="">Seleccione un ramal</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-700">Parada:</label>
                            <select id="select-colectivo-parada" disabled
                                class="w-full text-xs p-2 border border-gray-300 rounded focus:outline-none focus:border-[#19567C] font-semibold text-[#0F172A] cursor-pointer disabled:opacity-50">
                                <option value="">Seleccione una parada</option>
                            </select>
                        </div>
                        <div id="status-colectivo" class="text-xs text-gray-500 hidden mt-1 flex items-center gap-2">
                            <i class="fa-solid fa-spinner fa-spin text-[#19567C]"></i>
                            <span>Buscando colectivos cercanos...</span>
                        </div>
                        <div id="predictions-list" class="space-y-2 mt-3 hidden border-t border-gray-200 pt-3">
                            <!-- Aquí se inyectarán los arribos en tiempo real -->
                        </div>
                    </div>
                </div>

                <!-- Tránsito en Tiempo Real -->
                <div class="bg-[#19567C]/10 p-3 rounded-lg border border-[#19567C]/30">
                    <h4 class="text-xs font-extrabold text-[#19567C] uppercase mb-3 flex items-center gap-2">
                        <i data-lucide="car" class="h-4 w-4"></i> Tránsito Google
                    </h4>

                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-trafico" class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">Ver Tránsito en Vivo</span>
                        </label>
                    </div>
                </div>

            </div>
        </aside>

        <div
            class="flex-1 bg-white p-2 rounded-xl shadow-lg border border-[#E6EDF3] flex flex-col min-h-[500px] relative z-10">
            <div id="map"></div>
        </div>

    </main>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2MHti5Cy4IDKPc3Iu0ypNQg_BgsjcMoQ&callback=initMap"
        defer></script>

        let map, infoWindow, trafficLayer;
        let infoWindowTimer; // Temporizador global para el cierre automático
        let limiteElements = []; // Array para almacenar Polygons/Polylines del límite punteado
        let lomasPolygons = []; // Array de polígonos del límite de Lomas de Zamora
        let arrivalPolylines = {}; // Polílineas animadas de llegada al colectivo
        let polylineAnimationOffset = 0; // Animación de flechas de llegada
        let sidebarRoutePolylines = {}; // Diccionario de polilíneas de ruta cargadas por archivo (nombre -> [glow, core])
        let sidebarRoutePoints = {}; // Diccionario de coordenadas LatLng cargadas (nombre -> [latLng, ...])
        let currentRoutePoints = []; // Coordenadas LatLng de la ruta del ramal seleccionado para predicción
        let autoCheckedFile = null; // Nombre de archivo de la ruta auto-marcada por el dropdown

        // Algoritmo de Ray-Casting (Even-Odd Rule) para determinar si un punto está dentro de un polígono
        function isPointInPolygon(point, polygon) {
            const x = point.lng, y = point.lat;
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].lng, yi = polygon[i].lat;
                const xj = polygon[j].lng, yj = polygon[j].lat;

                const intersect = ((yi > y) !== (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function isPointInLomas(lat, lng) {
            if (lomasPolygons.length === 0) return true; // Fallback si no cargaron los límites
            const pt = { lat, lng };
            return lomasPolygons.some(poly => isPointInPolygon(pt, poly));
        }

        // Obtener el índice más cercano de un punto en la polilínea
        function getClosestIndex(latLng, points) {
            let minDist = Infinity;
            let closestIdx = -1;
            const lat1 = latLng.lat;
            const lng1 = latLng.lng;
            for (let i = 0; i < points.length; i++) {
                const lat2 = points[i].lat();
                const lng2 = points[i].lng();
                const dist = (lat1 - lat2) * (lat1 - lat2) + (lng1 - lng2) * (lng1 - lng2);
                if (dist < minDist) {
                    minDist = dist;
                    closestIdx = i;
                }
            }
            return closestIdx;
        }

        // Calcular distancia en metros entre dos coordenadas (Haversine simple)
        function getDistanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000; // Radio de la Tierra en metros
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Dibujar el recorrido en el mapa con efecto Glow Neon
        function drawRoute(fileName, geoJson) {
            // Si ya está dibujada en el mapa, la removemos primero
            removeRoute(fileName);

            if (!geoJson || !geoJson.features || geoJson.features.length === 0) return;

            const coordinates = geoJson.features[0].geometry.coordinates.map(c => new google.maps.LatLng(c[1], c[0]));

            const glowPoly = new google.maps.Polyline({
                path: coordinates,
                strokeColor: '#4AB5E0',
                strokeOpacity: 0.45,
                strokeWeight: 10,
                map: map,
                zIndex: 4
            });

            const corePoly = new google.maps.Polyline({
                path: coordinates,
                strokeColor: '#19567C',
                strokeOpacity: 1.0,
                strokeWeight: 4,
                map: map,
                zIndex: 5
            });

            sidebarRoutePolylines[fileName] = [glowPoly, corePoly];
            sidebarRoutePoints[fileName] = coordinates;

            // Ajustar los límites del mapa para mostrar todo el recorrido
            if (coordinates.length > 0) {
                const bounds = new google.maps.LatLngBounds();
                coordinates.forEach(c => bounds.extend(c));
                map.fitBounds(bounds);
            }
        }

        // Remover recorrido del mapa
        function removeRoute(fileName) {
            if (sidebarRoutePolylines[fileName]) {
                sidebarRoutePolylines[fileName].forEach(p => p.setMap(null));
                delete sidebarRoutePolylines[fileName];
            }
            if (sidebarRoutePoints[fileName]) {
                delete sidebarRoutePoints[fileName];
            }
        }

        // Cargar/quitar recorrido de forma instantánea usando los datos embebidos
        function toggleRouteCheckbox(fileName, isChecked) {
            if (isChecked) {
                const key = fileName.replace(".geojson", "");
                const geoJson = EMBEDDED_GEOJSON[key];
                if (geoJson) {
                    drawRoute(fileName, geoJson);

                    // Si coincide con el recorrido actualmente seleccionado, actualizar currentRoutePoints
                    const expectedFile = getExpectedRouteFile();
                    if (expectedFile === fileName) {
                        let points = sidebarRoutePoints[fileName] || [];
                        if (fileName === "277 - a Oliver.geojson") {
                            points = [...points].reverse();
                        }
                        currentRoutePoints = points;
                    }
                } else {
                    console.error("Recorrido no encontrado en datos embebidos:", fileName);
                }
            } else {
                removeRoute(fileName);

                // Si coincide con el recorrido actualmente seleccionado, limpiar currentRoutePoints
                const expectedFile = getExpectedRouteFile();
                if (expectedFile === fileName) {
                    currentRoutePoints = [];
                }
            }
        }

            if (text.includes("Ramal 6 I") || text.includes("6 I")) return `${prefix} - 6 I.geojson`;
            if (text.includes("Ramal 6 V") || text.includes("6 V")) return `${prefix} - 6 V.geojson`;
            if (text.includes("Ramal 7/8 I") || text.includes("7/8 I") || text.includes("7:8 I")) return `${prefix} - 7:8 I.geojson`;
            if (text.includes("Ramal 7/8 V") || text.includes("7/8 V") || text.includes("7:8 V")) return `${prefix} - 7:8 V.geojson`;
            if (text.includes("Ramal 3 I") || text.includes("3 I")) return `${prefix} - 3 I.geojson`;
            if (text.includes("Ramal 3 V") || text.includes("3 V")) return `${prefix} - 3 V.geojson`;
            if (text.includes("Ramal 9 I") || text.includes("9 I")) return `${prefix} - 9 I.geojson`;
            if (text.includes("Ramal 9 V") || text.includes("9 V")) return `${prefix} - 9 V.geojson`;

            return null;
        }

            function startPredictionsPolling(paradaId, lineaId) {
                if (predictionsIntervalId) {
                    clearInterval(predictionsIntervalId);
                }

                fetchPredictions(paradaId, lineaId);
                predictionsIntervalId = setInterval(() => {
                    fetchPredictions(paradaId, lineaId);
                }, 25000);
            }

            function stopPredictionsPolling() {
                if (predictionsIntervalId) {
                    clearInterval(predictionsIntervalId);
                    predictionsIntervalId = null;
                }

                for (let key in busMarkers) {
                    if (busMarkers[key]) {
                        busMarkers[key].setMap(null);
                    }
                }
                busMarkers = {};

                for (let key in arrivalPolylines) {
                    if (arrivalPolylines[key]) {
                        arrivalPolylines[key].setMap(null);
                    }
                }
                arrivalPolylines = {};

                const statusDiv = document.getElementById('status-colectivo');
                if (statusDiv) statusDiv.classList.add('hidden');

                const listDiv = document.getElementById('predictions-list');
                if (listDiv) {
                    listDiv.innerHTML = "";
                    listDiv.classList.add('hidden');
                }
            }

            async function fetchPredictions(paradaId, lineaId) {
                const statusDiv = document.getElementById('status-colectivo');
                if (statusDiv) statusDiv.classList.remove('hidden');

                try {
                    const response = await fetch(`${PROXY_BASE_URL}/prediccion?parada=${paradaId}&linea=${lineaId}`);
                    const data = await response.json();

                    const activeInternos = new Set();

                    if (Array.isArray(data)) {
                        // Obtener coordenadas de la parada seleccionada
                        const selectParada = document.getElementById('select-colectivo-parada');
                        if (!selectParada || selectParada.selectedIndex === -1) return;
                        const selectedParadaOpt = selectParada.options[selectParada.selectedIndex];
                        if (!selectedParadaOpt) return;
                        const paradaLat = parseFloat(selectedParadaOpt.getAttribute('data-lat'));
                        const paradaLng = parseFloat(selectedParadaOpt.getAttribute('data-lng'));
                        if (isNaN(paradaLat) || isNaN(paradaLng)) return;
                        const paradaLatLng = { lat: paradaLat, lng: paradaLng };

                        // === PASO 1: Parsear y filtrar TODOS los colectivos primero ===
                        const validBuses = [];
                        const seenInternos = new Set();
                        data.forEach(bus => {
                            const interno = bus.interno;
                            if (!interno) return;
                            
                            // Filtrar duplicados que a veces retorna la API de Bondicom
                            if (seenInternos.has(interno)) return;
                            seenInternos.add(interno);

                            let latRaw = bus.lat !== undefined ? bus.lat : bus.latitud;
                            let lngRaw = bus.lon !== undefined ? bus.lon : bus.longitud;

                            if (latRaw === undefined || lngRaw === undefined) return;

                            let lat = parseFloat(latRaw);
                            let lng = parseFloat(lngRaw);

                            if (Math.abs(lat) > 90) lat = lat / 1000000.0;
                            if (Math.abs(lng) > 180) lng = lng / 1000000.0;

                            if (isNaN(lat) || isNaN(lng)) return;

                            const newPos = { lat, lng };

                            // NOTA: Se eliminan los filtros rígidos de distancia de la ruta y orden de paradas para EVG.
                            // Las APIs de colectivos ya devuelven únicamente las unidades aproximándose a la parada.
                            // Intentar filtrar en el cliente con archivos GeoJSON simplificados o incompletos causaba
                            // que los colectivos desaparecieran erróneamente en la mayoría de las búsquedas.

                            const eta = bus.tiempo || bus.tiempoEstimado || 'Sin estimación';
                            const cartel = (bus.cartel || bus.ramal || '').trim() || 'Colectivo';

                            // 1. Filtrado de Autobuses por texto del cartel (ramal)
                            if (parseInt(lineaId) >= 1000) {
                                const selectRec = document.getElementById('select-colectivo-recorrido');
                                if (selectRec && selectRec.value && selectRec.selectedIndex !== -1) {
                                    const recText = selectRec.options[selectRec.selectedIndex].textContent.toUpperCase();
                                    const busCartel = cartel.toUpperCase();
                                    if (busCartel && busCartel !== 'COLECTIVO' && !recText.includes(busCartel)) {
                                        return;
                                    }
                                }
                            }

                            // 2. Filtrado geométrico por ruta (para ambas APIs: EVG y Autobuses)
                            if (currentRoutePoints && currentRoutePoints.length > 0) {
                                const idxBus = getClosestIndex(newPos, currentRoutePoints);
                                const idxParada = getClosestIndex(paradaLatLng, currentRoutePoints);
                                if (idxBus !== -1 && idxParada !== -1) {
                                    const closestPt = currentRoutePoints[idxBus];
                                    const distToRoute = getDistanceMeters(newPos.lat, newPos.lng, closestPt.lat(), closestPt.lng());
                                    const distToParada = getDistanceMeters(newPos.lat, newPos.lng, paradaLatLng.lat, paradaLatLng.lng);

                                    // Filtrar si la unidad está muy alejada del trazado (por ejemplo, en el recorrido de vuelta u otra calle)
                                    // Usamos un umbral generoso de 800 metros debido a la simplificación de algunos archivos GeoJSON.
                                    // Omitimos este filtro para la línea 277 (ID: 1054) por la extrema simplificación de sus GeoJSONs.
                                    if (lineaId.toString() !== "1054" && distToRoute > 800) {
                                        return;
                                    }

                                    // Filtrar si la unidad ya superó la parada por más de 250 metros
                                    if (idxBus > idxParada && distToParada > 250) {
                                        return;
                                    }
                                }
                            }

                            validBuses.push({ interno, newPos, eta, cartel });
                        });

                        // === PASO 2: Tomar los 3 primeros colectivos válidos ===
                        const closestBuses = validBuses.slice(0, 3);

                        // Ajustar posiciones duplicadas o muy cercanas para evitar superposición completa (efecto spider)
                        for (let i = 0; i < closestBuses.length; i++) {
                            for (let j = 0; j < i; j++) {
                                const latDiff = closestBuses[i].newPos.lat - closestBuses[j].newPos.lat;
                                const lngDiff = closestBuses[i].newPos.lng - closestBuses[j].newPos.lng;
                                const distDeg = Math.sqrt(latDiff * latDiff + lngDiff * lngDiff);
                                if (distDeg < 0.00012) { // Aproximadamente 12 metros de cercanía
                                    // Desplazar ligeramente en una dirección angular
                                    const angle = (i * 2 * Math.PI) / closestBuses.length;
                                    closestBuses[i].newPos.lat += 0.00012 * Math.sin(angle);
                                    closestBuses[i].newPos.lng += 0.00012 * Math.cos(angle);
                                }
                            }
                        }

                        // === PASO 3: Renderizar marcadores y polilíneas en el mapa ===
                        closestBuses.forEach(({ interno, newPos, eta, cartel }) => {
                            activeInternos.add(interno);

                            if (busMarkers[interno]) {
                                const marker = busMarkers[interno];
                                const startPos = {
                                    lat: marker.getPosition().lat(),
                                    lng: marker.getPosition().lng()
                                };
                                marker.set('eta', eta);
                                marker.set('cartel', cartel);
                                animateMarker(marker, startPos, newPos, 4000);
                            } else {
                                const marker = new google.maps.Marker({
                                    position: newPos,
                                    map: map,
                                    title: `Interno: ${interno}`,
                                    icon: {
                                        url: (parseInt(lineaId) >= 10000) ? './YITOS.svg' : ((parseInt(lineaId) < 1000) ? './EVG.svg' : './AUTOBUSES.svg'),
                                        scaledSize: new google.maps.Size(36, 36),
                                        anchor: new google.maps.Point(18, 18)
                                    },
                                    zIndex: 110
                                });

                                marker.set('interno', interno);
                                marker.set('eta', eta);
                                marker.set('cartel', cartel);

                                marker.addListener('click', () => {
                                    const mInterno = marker.get('interno');
                                    const mEta = marker.get('eta');
                                    const mCartel = marker.get('cartel');

                                    const content = `
                                         <div style="font-family: 'Montserrat', sans-serif; min-width: 180px; position: relative;">
                                             <button onclick="window.closeInfoWindow()" class="custom-close-btn">&times;</button>
                                             <h3 style="font-weight: 800; font-size: 14px; color: #D34872; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">Colectivo en Camino</h3>
                                             <p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Interno:</b> ${mInterno}</p>
                                             <p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Ramal:</b> ${mCartel}</p>
                                             <p style="margin: 4px 0; font-size: 12px; color: #D34872; font-weight: bold;"><i class="fa-solid fa-clock"></i> Arribo: ${mEta}</p>
                                         </div>
                                    `;
                                    infoWindow.setContent(content);
                                    infoWindow.setPosition(marker.getPosition());
                                    infoWindow.open(map);
                                    startInfoWindowTimer();
                                });

                                busMarkers[interno] = marker;
                            }

                            // --- DIBUJAR CAPA DE RECORRIDO RESTANTE (Llegada a la parada) ---
                            let useStraightLine = true;
                            let pathSegment = [];

                            if (currentRoutePoints.length > 0 && !isNaN(paradaLat) && !isNaN(paradaLng)) {
                                const idxBus = getClosestIndex(newPos, currentRoutePoints);
                                const idxParada = getClosestIndex(paradaLatLng, currentRoutePoints);

                                if (idxBus !== -1 && idxParada !== -1) {
                                    const closestPt = currentRoutePoints[idxBus];
                                    const dist = getDistanceMeters(newPos.lat, newPos.lng, closestPt.lat(), closestPt.lng());

                                    // Si el colectivo está cerca del recorrido (800 metros), seguimos los puntos de la ruta
                                    if (dist <= 800) {
                                        useStraightLine = false;
                                        if (idxBus <= idxParada) {
                                            pathSegment = currentRoutePoints.slice(idxBus, idxParada + 1);
                                        } else {
                                            pathSegment = currentRoutePoints.slice(idxParada, idxBus + 1).reverse();
                                        }
                                    }
                                }
                            }

                            if (useStraightLine && !isNaN(paradaLat) && !isNaN(paradaLng)) {
                                // Fallback a línea recta si no hay puntos de ruta cargados o el coche está fuera de la polilínea
                                pathSegment = [
                                    new google.maps.LatLng(newPos.lat, newPos.lng),
                                    new google.maps.LatLng(paradaLat, paradaLng)
                                ];
                            }

                            if (pathSegment.length > 0) {
                                // Conectar exactamente con el marcador del colectivo y de la parada
                                const firstPt = pathSegment[0];
                                const lastPt = pathSegment[pathSegment.length - 1];
                                
                                if (Math.abs(firstPt.lat() - newPos.lat) > 0.00001 || Math.abs(firstPt.lng() - newPos.lng) > 0.00001) {
                                    pathSegment.unshift(new google.maps.LatLng(newPos.lat, newPos.lng));
                                }
                                if (Math.abs(lastPt.lat() - paradaLat) > 0.00001 || Math.abs(lastPt.lng() - paradaLng) > 0.00001) {
                                    pathSegment.push(new google.maps.LatLng(paradaLat, paradaLng));
                                }

                                if (arrivalPolylines[interno]) {
                                    arrivalPolylines[interno].setPath(pathSegment);
                                } else {
                                    const arrowColor = (parseInt(lineaId) >= 10000) ? '#0055ff' : ((parseInt(lineaId) < 1000) ? '#19567C' : '#D34872');

                                    const arrowSymbol = {
                                        path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                                        scale: 2.5,
                                        strokeColor: arrowColor,
                                        fillColor: arrowColor,
                                        fillOpacity: 1
                                    };

                                    arrivalPolylines[interno] = new google.maps.Polyline({
                                        path: pathSegment,
                                        strokeColor: arrowColor,
                                        strokeOpacity: 0.8,
                                        strokeWeight: 4,
                                        icons: [{
                                            icon: arrowSymbol,
                                            offset: '0px',
                                            repeat: '45px'
                                        }],
                                        map: map
                                    });
                                }
                            }
                        });

                        // === PASO 4: Poblar panel lateral de Próximos Arribos ===
                        const listDiv = document.getElementById('predictions-list');
                        if (listDiv) {
                            if (closestBuses.length === 0) {
                                listDiv.innerHTML = `
                                    <div style="font-family:'Montserrat',sans-serif;" class="text-center py-3 px-2">
                                        <i class="fa-solid fa-bus-slash text-gray-300 text-2xl mb-2 block"></i>
                                        <p class="text-xs text-gray-400 italic">No se registran colectivos en este ramal actualmente.</p>
                                    </div>`;
                            } else {
                                listDiv.innerHTML = `
                                    <p class="text-xs font-extrabold text-[#19567C] uppercase mb-2 flex items-center gap-1">
                                        <i class="fa-solid fa-satellite-dish text-[#D34872] text-xs"></i>&nbsp;Próximos Arribos
                                    </p>
                                    ${closestBuses.map(({ interno, eta, cartel, newPos }) => `
                                        <div onclick="window.focusOnBus('${interno}', ${newPos.lat}, ${newPos.lng})"
                                             class="flex items-center justify-between bg-white border border-[#E6EDF3] rounded-lg px-3 py-2 cursor-pointer transition-all hover:bg-[#19567C]/5 hover:border-[#4AB5E0]"
                                             style="font-family:'Montserrat',sans-serif; margin-bottom:6px;">
                                            <div class="flex items-center gap-2">
                                                <div class="bg-[#19567C] rounded-full w-6 h-6 flex items-center justify-center shrink-0">
                                                    <i class="fa-solid fa-bus text-white" style="font-size:9px"></i>
                                                </div>
                                                <div>
                                                    <p class="text-[11px] font-bold text-[#0F172A] leading-tight">Interno ${interno}</p>
                                                    <p class="text-[10px] text-gray-500 leading-tight">${cartel}</p>
                                                </div>
                                            </div>
                                            <div class="text-right shrink-0">
                                                <p class="text-[13px] font-extrabold text-[#D34872] leading-tight">${eta}</p>
                                                <p class="text-[9px] text-gray-400 uppercase">arribo</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                `;
                            }
                            listDiv.classList.remove('hidden');
                        }
                    }

                    for (let key in busMarkers) {
                        if (!activeInternos.has(key)) {
                            if (busMarkers[key]) {
                                busMarkers[key].setMap(null);
                            }
                            delete busMarkers[key];

                            // Limpiar pololínea del colectivo removido
                            if (arrivalPolylines[key]) {
                                arrivalPolylines[key].setMap(null);
                                delete arrivalPolylines[key];
                            }
                        }
                    }

                } catch (error) {
                    console.error('Error al actualizar predicciones:', error);
                } finally {
                    if (statusDiv) statusDiv.classList.add('hidden');
                }
            }

            function animateMarker(marker, startPos, endPos, duration = 3000) {
                const startTime = performance.now();
                const interno = marker.get('interno');

                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    const lat = startPos.lat + (endPos.lat - startPos.lat) * progress;
                    const lng = startPos.lng + (endPos.lng - startPos.lng) * progress;

                    const latLng = new google.maps.LatLng(lat, lng);
                    marker.setPosition(latLng);

                    if (arrivalPolylines[interno]) {
                        const path = arrivalPolylines[interno].getPath();
                        if (path && path.getLength() > 0) {
                            path.setAt(0, latLng);
                        }
                    }

                    if (infoWindow && infoWindow.getMap() && infoWindow.getPosition() &&
                        Math.abs(infoWindow.getPosition().lat() - startPos.lat) < 0.0001 &&
                        Math.abs(infoWindow.getPosition().lng() - startPos.lng) < 0.0001) {
                        infoWindow.setPosition(latLng);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(step);
                    }
                }

                requestAnimationFrame(step);
            }

            document.getElementById('select-colectivo-linea').addEventListener('change', onLineaChange);
            document.getElementById('select-colectivo-recorrido').addEventListener('change', onRecorridoChange);
            document.getElementById('select-colectivo-parada').addEventListener('change', onParadaChange);

            // Cargar líneas inicialmente ya que el panel Próximo Colectivo está expandido por defecto
            cargarLineasColectivos();

            // Loop de animación para las flechas de llegada a la parada (cada 80ms)
            setInterval(() => {
                polylineAnimationOffset = (polylineAnimationOffset + 2) % 40;
                for (let key in arrivalPolylines) {
                    const poly = arrivalPolylines[key];
                    if (poly) {
                        const icons = poly.get('icons');
                        if (icons && icons[0]) {
                            icons[0].offset = polylineAnimationOffset + 'px';
                            poly.set('icons', icons);
                        }
                    }
                }
            }, 80);
        }
    </script>
</body>

</html>
